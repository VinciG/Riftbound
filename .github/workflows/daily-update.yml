name: Daily Riftbound Update

on:
  schedule:
    - cron: "43 3 * * *" #Forzar commit

  workflow_dispatch:

# 💡 Forzamos a las acciones del workflow a utilizar Node 24 de forma nativa
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run updater
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python update_web.py

      - name: Validate no data loss
        run: |
          python -c "import json,sys; d=json.load(open('cartas.json')); bad=[k for k,v in d['sets'].items() if v.get('legend_count',0)==0 and len(v.get('leyendas',[]))==0 and v.get('total',0)>0 and k in ('origins','spiritforged','unleashed','vendetta')]; print(f'legend check: {bad}'); sys.exit(1) if bad else print('✅ cartas.json OK'); ld=json.load(open('legend_data.json')); assert sum(len(v) for v in ld.values())>0, 'legend_data.json empty'; print(f\"✅ legend_data.json OK ({sum(len(v) for v in ld.values())} leyendas)\")"

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python notify.py

      - name: Commit changes
        run: |
          git config user.name "Riftbound Bot"
          git config user.email "actions@github.com"
          
          git add cartas.json cardmarket_prices.json epic-cards.js id_to_name.json legend_data.json
          git diff --cached --quiet || git commit -m "Auto update Riftbound database JSON"
          
          git add index.html
          git diff --cached --quiet || git commit -m "Auto update Riftbound database"

      - name: Push
        run: |
          git push
        if: success()
